server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — client-side routing (React Router) needs every unknown
    # path to resolve to index.html, not a 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed build assets aggressively; index.html itself is never cached
    # so a new deploy is picked up immediately.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
