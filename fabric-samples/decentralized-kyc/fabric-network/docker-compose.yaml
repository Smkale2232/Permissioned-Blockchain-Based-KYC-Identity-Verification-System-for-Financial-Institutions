version: '3.7'

networks:
  kyc-network:
    name: kyc-network

volumes:
  orderer.example.com:
  peer0.banka.com:
  peer0.bankb.com:
  peer0.regulator.com:

services:

  orderer.example.com:
    container_name: orderer.example.com
    image: hyperledger/fabric-orderer:2.5.7
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
    volumes:
      - ./organizations/cryptogen/ordererOrganizations/example.com/orderers/orderer.example.com/msp:/var/hyperledger/orderer/msp
      - ./organizations/cryptogen/ordererOrganizations/example.com/orderers/orderer.example.com/tls:/var/hyperledger/orderer/tls
      - orderer.example.com:/var/hyperledger/production/orderer
    ports:
      - "7050:7050"
      - "7053:7053"
    networks:
      - kyc-network

  peer0.banka.com:
    container_name: peer0.banka.com
    image: hyperledger/fabric-peer:2.5.7
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_PEER_DISCOVERY_ORGMEMBERSALLOWEDACCESS=true
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=kyc-network
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.banka.com
      - CORE_PEER_ADDRESS=peer0.banka.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.banka.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.banka.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.banka.com:7051
      - CORE_PEER_LOCALMSPID=BankAMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/cryptogen/peerOrganizations/banka.com/peers/peer0.banka.com/msp:/etc/hyperledger/fabric/msp
      - ./organizations/cryptogen/peerOrganizations/banka.com/peers/peer0.banka.com/tls:/etc/hyperledger/fabric/tls
      - peer0.banka.com:/var/hyperledger/production
    ports:
      - "7051:7051"
    networks:
      - kyc-network

  peer0.bankb.com:
    container_name: peer0.bankb.com
    image: hyperledger/fabric-peer:2.5.7
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_PEER_DISCOVERY_ORGMEMBERSALLOWEDACCESS=true
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=kyc-network
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.bankb.com
      - CORE_PEER_ADDRESS=peer0.bankb.com:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_CHAINCODEADDRESS=peer0.bankb.com:8052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.bankb.com:8051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.bankb.com:8051
      - CORE_PEER_LOCALMSPID=BankBMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/cryptogen/peerOrganizations/bankb.com/peers/peer0.bankb.com/msp:/etc/hyperledger/fabric/msp
      - ./organizations/cryptogen/peerOrganizations/bankb.com/peers/peer0.bankb.com/tls:/etc/hyperledger/fabric/tls
      - peer0.bankb.com:/var/hyperledger/production
    ports:
      - "8051:8051"
    networks:
      - kyc-network

  peer0.regulator.com:
    container_name: peer0.regulator.com
    image: hyperledger/fabric-peer:2.5.7
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_PEER_DISCOVERY_ORGMEMBERSALLOWEDACCESS=true
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=kyc-network
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.regulator.com
      - CORE_PEER_ADDRESS=peer0.regulator.com:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.regulator.com:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.regulator.com:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.regulator.com:9051
      - CORE_PEER_LOCALMSPID=RegulatorMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/cryptogen/peerOrganizations/regulator.com/peers/peer0.regulator.com/msp:/etc/hyperledger/fabric/msp
      - ./organizations/cryptogen/peerOrganizations/regulator.com/peers/peer0.regulator.com/tls:/etc/hyperledger/fabric/tls
      - peer0.regulator.com:/var/hyperledger/production
    ports:
      - "9051:9051"
    networks:
      - kyc-network
