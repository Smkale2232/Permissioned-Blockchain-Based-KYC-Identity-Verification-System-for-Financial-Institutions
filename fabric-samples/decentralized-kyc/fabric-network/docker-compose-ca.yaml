version: '3.7'

networks:
  kyc-network:
    name: kyc-network

services:

  ca.banka.com:
    image: hyperledger/fabric-ca:1.5.7
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca.banka.com
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
      - FABRIC_CA_SERVER_CSR_CN=ca.banka.com
      - FABRIC_CA_SERVER_CSR_HOSTS=ca.banka.com,localhost
    ports:
      - "7054:7054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ./organizations/bankA/ca:/etc/hyperledger/fabric-ca-server
    container_name: ca.banka.com
    networks:
      - kyc-network

  ca.bankb.com:
    image: hyperledger/fabric-ca:1.5.7
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca.bankb.com
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=8054
      - FABRIC_CA_SERVER_CSR_CN=ca.bankb.com
      - FABRIC_CA_SERVER_CSR_HOSTS=ca.bankb.com,localhost
    ports:
      - "8054:8054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ./organizations/bankB/ca:/etc/hyperledger/fabric-ca-server
    container_name: ca.bankb.com
    networks:
      - kyc-network

  ca.regulator.com:
    image: hyperledger/fabric-ca:1.5.7
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca.regulator.com
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=9054
      - FABRIC_CA_SERVER_CSR_CN=ca.regulator.com
      - FABRIC_CA_SERVER_CSR_HOSTS=ca.regulator.com,localhost
    ports:
      - "9054:9054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ./organizations/regulator/ca:/etc/hyperledger/fabric-ca-server
    container_name: ca.regulator.com
    networks:
      - kyc-network
